# Shared bridge attachment for tenant clusters created from this template.
# The template's pod annotation references p-default/br0-vcluster, so this must
# exist or the control plane comes up without its br0 interface and kube-vip
# cannot claim the endpoint VIP.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-vcluster
  namespace: p-default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br0",
      "isDefaultGateway": false,
      "ipam": {}
    }

---
apiVersion: storage.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: bare-metal-vmetal-template
spec:
  displayName: Bare Metal (vMetal auto-nodes)
  description: |
    Provisions a vCluster with a real bare metal node via the vMetal (metal3)
    NodeProvider, using the "bare-metal" NodeEnvironment.
  access:
    - users:
        - "*"
      verbs:
        - get
  template:
    metadata: {}
    instanceTemplate:
      metadata: {}
    pro:
      enabled: true
    helmRelease:
      chart:
        version: 0.31.0-rc.1
      values: |
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          endpoint: 192.168.100.2:8443
          advanced:
            kubeVip:
              enabled: true
              interface: net1
              gateway: 192.168.100.1/24
          statefulSet:
            pods:
              annotations:
                k8s.v1.cni.cncf.io/networks: p-default/br0-vcluster
            env:
              - name: VCLUSTER_NODECLAIM_WAIT_TIMEOUT
                value: 1h
        privateNodes:
          enabled: true
          autoNodes:
            - provider: metal3
              static:
                - name: bare-metal
                  quantity: 1
              properties:
                vcluster.com/os-image: ubuntu2404-20260826
