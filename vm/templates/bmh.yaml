{{- range .Values.vms }}
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  namespace: {{ .bmh.boot.namespace }}
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
  annotations:
    metal3.vcluster.com/ip-address: {{ .bmh.ip }}
    metal3.vcluster.com/dns-servers: {{ .bmh.dns }}
    metal3.vcluster.com/gateway: {{ .bmh.gateway }}
spec:
  # MUST be false: the platform only claims hosts that are powered off.
  # See isBMHAvailable() in pkg/autoscaling/provider_metal3.go - a host with
  # status.poweredOn=true is skipped, so `online: true` makes every host
  # permanently unclaimable ("no available BareMetalHost found for NodeType").
  # Ironic powers the machine on itself when it provisions it.
  online: false
  automatedCleaningMode: disabled
  bootMACAddress: {{ .mac | quote }}
  bmc:
    address: redfish://{{ .name }}-virtbmc.default.svc.cluster.local:443
    credentialsName: {{ .name }}-boot-bmc
    disableCertificateVerification: true
  rootDeviceHints:
    deviceName: {{ .bmh.boot.rootDevice }}

---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .bmh.boot.namespace }}
  name: {{ .name }}-boot-bmc
stringData:
  username: {{ .bmh.bmc.username | quote }}
  password: {{ .bmh.bmc.password | quote }}

---
{{- end }}
